name: DukaanOS CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-check:
    name: Build and basic tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtmultimedia
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true

      - name: Cache C++ compilations
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: windows-mingw-13.1-qt-6.8.3

      - name: Configure and build
        run: |
          $qtPrefix = $env:QT_ROOT_DIR
          if (-not $qtPrefix -or -not (Test-Path "$qtPrefix\lib\cmake\Qt6")) {
            throw "Qt installation was not found at QT_ROOT_DIR: $qtPrefix"
          }
          $compiler = (Get-Command g++.exe -ErrorAction Stop).Source
          $compilerVersion = & $compiler --version | Select-Object -First 1
          if ($compilerVersion -notmatch "13\.1\.0") {
            throw "Qt 6.8.3 requires MinGW 13.1.0; found: $compilerVersion"
          }
          $mingwBin = Split-Path $compiler -Parent
          $env:PATH = "$qtPrefix\bin;$mingwBin;$env:PATH"
          cmake -S . -B build-ci `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DCMAKE_CXX_COMPILER="$compiler" `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DBUILD_TESTING=ON
          cmake --build build-ci --config Release

      - name: Run tests
        shell: pwsh
        run: |
          $qtPrefix = $env:QT_ROOT_DIR
          if (-not $qtPrefix -or -not (Test-Path "$qtPrefix\lib\cmake\Qt6")) {
            throw "Qt installation was not found at QT_ROOT_DIR: $qtPrefix"
          }
          $compiler = (Get-Command g++.exe -ErrorAction Stop).Source
          $mingwBin = Split-Path $compiler -Parent
          $env:PATH = "$qtPrefix\bin;$mingwBin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build-ci --output-on-failure
