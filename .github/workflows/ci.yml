name: DukaanOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  basic-check:
    name: Build and basic tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtmultimedia

      - name: Configure and build
        run: |
          $qtPrefix = $env:QT_ROOT_DIR
          if (-not $qtPrefix -or -not (Test-Path "$qtPrefix\lib\cmake\Qt6")) {
            throw "Qt installation was not found at QT_ROOT_DIR: $qtPrefix"
          }
          $qtInstallRoot = Split-Path (Split-Path $qtPrefix -Parent) -Parent
          $mingwRoot = Get-ChildItem -Directory (Join-Path $qtInstallRoot "Tools") -Filter "mingw*_64" |
            Sort-Object Name |
            Select-Object -First 1
          if (-not $mingwRoot) {
            throw "Matching MinGW toolchain was not found under $qtInstallRoot\Tools"
          }
          $mingwBin = Join-Path $mingwRoot.FullName "bin"
          $compiler = Join-Path $mingwBin "g++.exe"
          $env:PATH = "$qtPrefix\bin;$mingwBin;$env:PATH"
          cmake -S . -B build-ci `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DCMAKE_CXX_COMPILER="$compiler" `
            -DBUILD_TESTING=ON
          cmake --build build-ci --config Release

      - name: Run tests
        shell: pwsh
        run: |
          $qtPrefix = $env:QT_ROOT_DIR
          if (-not $qtPrefix -or -not (Test-Path "$qtPrefix\lib\cmake\Qt6")) {
            throw "Qt installation was not found at QT_ROOT_DIR: $qtPrefix"
          }
          $qtInstallRoot = Split-Path (Split-Path $qtPrefix -Parent) -Parent
          $mingwRoot = Get-ChildItem -Directory (Join-Path $qtInstallRoot "Tools") -Filter "mingw*_64" |
            Sort-Object Name |
            Select-Object -First 1
          if (-not $mingwRoot) {
            throw "Matching MinGW toolchain was not found under $qtInstallRoot\Tools"
          }
          $mingwBin = Join-Path $mingwRoot.FullName "bin"
          $env:PATH = "$qtPrefix\bin;$mingwBin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build-ci --output-on-failure
