name: DukaanOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  basic-check:
    name: Build and basic tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        run: |
          cmake -S . -B build-ci `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DBUILD_TESTING=ON
          cmake --build build-ci --config Release

      - name: Run tests
        shell: pwsh
        run: |
          $qtPrefix = Resolve-Path (Join-Path $env:Qt6_DIR "..\..\..")
          $env:PATH = "$($qtPrefix.Path)\bin;$env:PATH"
          ctest --test-dir build-ci -C Release --output-on-failure
